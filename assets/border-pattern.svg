<svg xmlns="http://www.w3.org/2000/svg" width="40" height="24" viewBox="0 0 40 24">
  <defs>
    <linearGradient id="goldBrd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA8222"/>
      <stop offset="50%" stop-color="#FFF2C2"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>
  </defs>

  <!-- Outer solid line -->
  <line x1="0" y1="20" x2="40" y2="20" stroke="url(#goldBrd)" stroke-width="2" />
  
  <!-- Inner accent line -->
  <line x1="0" y1="12" x2="40" y2="12" stroke="url(#goldBrd)" stroke-width="1" stroke-dasharray="3,3" opacity="0.85" />

  <!-- Delicate central bead / diamond knot -->
  <circle cx="20" cy="16" r="1.6" fill="url(#goldBrd)"/>
  <circle cx="20" cy="16" r="0.7" fill="#FFFFFF"/>
</svg>
