<svg xmlns="http://www.w3.org/2000/svg" width="360" height="90" viewBox="0 0 360 90">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="30%" stop-color="#FFF2C2"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA8222"/>
      <stop offset="50%" stop-color="#FFF2C2"/>
      <stop offset="100%" stop-color="#AA8222"/>
    </linearGradient>
    <radialGradient id="plaqueGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#181510" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#0a0907" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Left connector lines (seamless junction with the bottom frame lines) -->
  <line x1="0" y1="65" x2="55" y2="65" stroke="url(#goldStroke)" stroke-width="2"/>
  <line x1="0" y1="57" x2="55" y2="57" stroke="url(#goldStroke)" stroke-width="1" stroke-dasharray="3,3" opacity="0.85"/>

  <!-- Right connector lines (seamless junction with the bottom frame lines) -->
  <line x1="305" y1="65" x2="360" y2="65" stroke="url(#goldStroke)" stroke-width="2"/>
  <line x1="305" y1="57" x2="360" y2="57" stroke="url(#goldStroke)" stroke-width="1" stroke-dasharray="3,3" opacity="0.85"/>

  <!-- Arching ribbons connecting borders into the center plaque -->
  <path d="M 55,65 C 75,65 85,55 95,45 C 105,35 120,20 180,20 C 240,20 255,35 265,45 C 275,55 285,65 305,65" 
        fill="none" stroke="url(#goldStroke)" stroke-width="1.8"/>
  <path d="M 55,57 C 75,57 85,47 95,37 C 105,27 120,12 180,12 C 240,12 255,27 265,37 C 275,47 285,57 305,57" 
        fill="none" stroke="url(#goldStroke)" stroke-width="1" opacity="0.75"/>

  <!-- Central Plaque Backdrop -->
  <ellipse cx="180" cy="48" rx="100" ry="32" fill="url(#plaqueGlow)" filter="url(#shadow)"/>

  <!-- Wedding Rings Symbol at Top -->
  <g transform="translate(180, 16)">
    <!-- Left Ring -->
    <ellipse cx="-7" cy="0" rx="9" ry="9" fill="none" stroke="url(#goldStroke)" stroke-width="2"/>
    <!-- Right Ring -->
    <ellipse cx="7" cy="0" rx="9" ry="9" fill="none" stroke="url(#goldStroke)" stroke-width="2"/>
    <!-- Diamond sparkle on top of ring -->
    <path d="M -7,-12 L -5,-9 L -7,-6 L -9,-9 Z" fill="#FFF2C2"/>
    <circle cx="-7" cy="-9" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Left & Right Filigree Flourishes -->
  <path d="M 100,48 C 112,42 118,32 112,24 C 106,18 96,26 104,34 C 110,40 120,44 135,46" 
        fill="none" stroke="url(#goldStroke)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 260,48 C 248,42 242,32 248,24 C 254,18 264,26 256,34 C 250,40 240,44 225,46" 
        fill="none" stroke="url(#goldStroke)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Couple Names: "Nataly & Jorge" (Great Vibes calligraphy font) -->
  <text id="namesText" x="180" y="52" 
        text-anchor="middle" 
        font-family="'Great Vibes', 'Cinzel', cursive, serif" 
        font-size="28" 
        fill="url(#goldText)"
        filter="url(#shadow)">Nataly &amp; Jorge</text>

  <!-- Date / Subtitle -->
  <text id="dateText" x="180" y="68" 
        text-anchor="middle" 
        font-family="'Cinzel', 'Cormorant Garamond', serif" 
        font-size="9" 
        font-weight="600"
        letter-spacing="2.5" 
        fill="url(#goldText)" 
        opacity="0.9">20 DE NOVIEMBRE DE 2026</text>

  <!-- Delicate accent dots -->
  <circle cx="180" cy="77" r="1.8" fill="url(#goldText)"/>
  <circle cx="170" cy="77" r="1" fill="url(#goldText)" opacity="0.7"/>
  <circle cx="190" cy="77" r="1" fill="url(#goldText)" opacity="0.7"/>
</svg>
