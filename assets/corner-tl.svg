<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldCorner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#FFF4D0"/>
      <stop offset="70%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="goldCornerStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Outer frame meeting points (top edge 0..100, left edge 0..100) -->
  <path d="M 100,2 L 2,2 L 2,100" fill="none" stroke="url(#goldCornerStroke)" stroke-width="1.5" />
  <path d="M 100,6 L 6,6 L 6,100" fill="none" stroke="url(#goldCorner)" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.8" />
  
  <path d="M 100,28 L 28,28 L 28,100" fill="none" stroke="url(#goldCornerStroke)" stroke-width="1.5" />
  <path d="M 100,24 L 24,24 L 24,100" fill="none" stroke="url(#goldCorner)" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.8" />

  <!-- Corner Flourish & Arabesque scrollwork -->
  <path d="M 28,28 C 45,28 65,40 70,60 C 72,70 65,78 55,75 C 45,72 48,58 58,54 C 64,52 68,56 66,62" 
        fill="none" stroke="url(#goldCorner)" stroke-width="1.8" stroke-linecap="round"/>
  
  <path d="M 28,28 C 28,45 40,65 60,70 C 70,72 78,65 75,55 C 72,45 58,48 54,58 C 52,64 56,68 62,66" 
        fill="none" stroke="url(#goldCorner)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Diagonal corner floral leaf -->
  <path d="M 2,2 Q 35,35 15,45 Q 15,15 2,2 Z" fill="url(#goldCorner)" opacity="0.75"/>
  <path d="M 2,2 Q 35,35 45,15 Q 15,15 2,2 Z" fill="url(#goldCorner)" opacity="0.75"/>

  <!-- Accent Gem in corner -->
  <circle cx="16" cy="16" r="4.5" fill="url(#goldCorner)" stroke="#74550e" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="28" cy="28" r="3" fill="url(#goldCorner)"/>
  <circle cx="28" cy="28" r="1.2" fill="#FFFFFF" opacity="0.85"/>
</svg>
